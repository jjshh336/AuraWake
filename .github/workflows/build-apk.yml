name: "Build Android APK (AuraWake)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
  CI: true

jobs:
  build-apk:
    name: "Build & Package Android APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "1. Checkout Source Code"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js Runtime (v22)"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "3. Setup Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "4. Setup Android SDK Environment"
        uses: android-actions/setup-android@v3

      - name: "5. Setup Gradle & Wrapper"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: "6. Install Node.js Dependencies"
        run: |
          echo "Installing npm dependencies..."
          npm install --legacy-peer-deps

      - name: "7. Build Web Frontend Assets"
        run: |
          echo "Running Vite production build..."
          npm run build
          echo "Validating dist/ directory output:"
          ls -la dist/

      - name: "8. Synchronize Capacitor Android Platform"
        run: |
          echo "Synchronizing Capacitor Android assets & plugins..."
          npx cap sync android

      - name: "9. Generate Clean Gradle Wrapper"
        run: |
          cd android
          echo "Generating official Gradle wrapper..."
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: "10. Compile Android Debug APK"
        run: |
          cd android
          echo "Building debug APK with Gradle..."
          ./gradlew assembleDebug --stacktrace --console=plain

      - name: "11. Diagnostic - Inspect Built APK Files"
        if: always()
        run: |
          echo "=== SEARCHING FOR GENERATED APKS ==="
          find . -name "*.apk" -ls

      - name: "12. Upload Debug APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AuraWake-Alarm-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 14
